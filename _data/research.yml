# Content for the research page (_pages/research.md).
#
# Each area has a title and a venue (the _data/venues.yml entry that sets its tag colors).
# To show key research questions when an area is selected, add a `questions:` list to it.
#
# Projects appear on the page in the order listed here, so keep the newest first.
# Each project has:
#   name:    the project name
#   area:    the title of the area it belongs to
#   tagline: one short line about the project
#   image:   a file in assets/img/, e.g. my_project.jpg (leave blank for a placeholder)
#   links:   any number of label + url pairs, e.g. Publication, Live site

areas:
  - title: AI literacy
    venue: AI Literacy
  - title: Ethics and policy
    venue: Ethics and Policy
  - title: Human-AI interaction
    venue: HCI

